<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070812"><title>YASIN'S AI</title>
<style>
:root{color-scheme:dark;--bg:#070812;--line:#252b45;--blue:#58a6ff;--purple:#9b6dff;--text:#f5f7ff;--muted:#a8aec8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% 0%,#20204b 0%,transparent 42%),radial-gradient(ellipse at 100% 30%,#151b46 0%,transparent 35%),var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;display:flex;justify-content:center;padding:18px}
.app{width:100%;max-width:850px;min-height:calc(100vh - 36px);display:flex;flex-direction:column;border:1px solid #2c3150;border-radius:24px;overflow:hidden;background:#090b18dd;box-shadow:0 0 60px #5268ff16}
header{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px}.logo{height:46px;width:46px;border-radius:15px;background:linear-gradient(135deg,var(--blue),var(--purple));display:grid;place-items:center;color:#080b18;font-weight:900;font-size:20px;box-shadow:0 0 24px #716cff55}
h1{font-size:18px;letter-spacing:.08em;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:2px}.status{margin-left:auto;font-size:11px;color:#a7f3d0;border:1px solid #28594b;background:#10291f;padding:5px 9px;border-radius:99px;white-space:nowrap}
main{flex:1;display:flex;flex-direction:column;padding:24px;gap:18px}.welcome{text-align:center;margin:auto auto 8px;max-width:520px;padding:20px 0}.orb{width:78px;height:78px;border-radius:50%;margin:0 auto 18px;background:radial-gradient(circle at 30% 25%,#d3e9ff,#5b7dff 38%,#9a5aff 68%,#241a56);box-shadow:0 0 45px #6d70ff55;position:relative}.orb:after{content:"";position:absolute;inset:-7px;border:1px solid #8193ff66;border-radius:50%;animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.12);opacity:.45}}
h2{font-size:clamp(25px,5vw,36px);line-height:1.15;margin:0 0 12px}h2 span{background:linear-gradient(90deg,#72c4ff,#b58aff);color:transparent;background-clip:text}.welcome p{color:var(--muted);margin:0 auto 22px;max-width:430px}
.suggestions{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}.suggestions button{border:1px solid #333958;background:#111528;color:#dce3ff;padding:10px 13px;border-radius:13px;cursor:pointer;font-size:13px}.suggestions button:hover{border-color:var(--blue);background:#171d38}
#chat{display:flex;flex-direction:column;gap:14px}.msg{max-width:88%;padding:13px 15px;border-radius:17px;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:linear-gradient(135deg,#3456a8,#6543a5);border-bottom-right-radius:5px}.bot{align-self:flex-start;background:#121629;border:1px solid #292f4a;border-bottom-left-radius:5px}.who{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#aeb9df;margin-bottom:5px}
.composer{padding:16px 18px 12px;border-top:1px solid var(--line);background:#0b0e1c}form{display:flex;gap:10px}textarea{flex:1;resize:none;min-height:48px;max-height:130px;border:1px solid #303653;border-radius:15px;background:#101426;color:var(--text);padding:13px 14px;font:inherit;outline:none}textarea:focus{border-color:#6c8cff;box-shadow:0 0 0 3px #627bff18}.send{border:0;border-radius:14px;padding:0 18px;background:linear-gradient(135deg,#6ab8ff,#9569ff);color:#080b18;font-weight:800;cursor:pointer}.send:disabled{opacity:.5;cursor:wait}
.tools{display:flex;justify-content:space-between;gap:10px;align-items:center;padding-top:10px;color:#7f87a7;font-size:11px}.clear{background:none;border:0;color:#aeb7d9;cursor:pointer;font-size:12px}.clear:hover{color:white}.note{color:#8d95b4;font-size:11px;text-align:center;margin-top:8px}footer{text-align:center;color:#656d8c;font-size:11px;padding:0 15px 14px}
@media(max-width:520px){body{padding:0}.app{min-height:100vh;border-radius:0;border:0}.status{font-size:10px;padding:4px 7px}header{padding:16px}main{padding:18px 15px}.welcome{padding:14px 0}.composer{padding:12px}.send{padding:0 14px}.msg{max-width:94%}}
</style></head><body><div class="app">
<header><div class="logo">Y</div><div><h1>YASIN’S AI</h1><div class="sub">YOUR SMART AI ASSISTANT</div></div><div class="status" id="status">● Connecting-ready</div></header>
<main><section class="welcome" id="welcome"><div class="orb"></div><h2>Welcome to <span>YASIN’S AI</span></h2><p>Ask, learn, plan, and create. Chat in English, Hindi, or Urdu.</p><div class="suggestions"><button type="button" data-prompt="Give me a cool project idea">✨ Project ideas</button><button type="button" data-prompt="Explain artificial intelligence simply">🧠 Learn AI</button><button type="button" data-prompt="Help me make a study plan">📚 Study plan</button></div></section><section id="chat" aria-live="polite"></section></main>
<div class="composer"><form id="form"><textarea id="prompt" rows="1" placeholder="Message YASIN’S AI..." aria-label="Your message"></textarea><button class="send" id="send" type="submit">Send ↗</button></form><div class="tools"><span>Gemini-powered • API key kept on server</span><button class="clear" id="clear" type="button">Clear chat ↺</button></div><div class="note">AI can make mistakes. Avoid sharing private information.</div></div><footer>Created by Yasin</footer></div>
<script>
const form=document.querySelector('#form'),input=document.querySelector('#prompt'),chat=document.querySelector('#chat'),welcome=document.querySelector('#welcome'),send=document.querySelector('#send'),statusEl=document.querySelector('#status');
let history=[];
function addMessage(text,who){const div=document.createElement('div');div.className='msg '+who;const label=document.createElement('span');label.className='who';label.textContent=who==='user'?'You':'YASIN’S AI';div.append(label,document.createTextNode(text));chat.appendChild(div);div.scrollIntoView({behavior:'smooth',block:'nearest'});return div;}
async function submitPrompt(text){const q=(text||input.value).trim();if(!q||send.disabled)return;welcome.style.display='none';addMessage(q,'user');input.value='';send.disabled=true;send.textContent='…';statusEl.textContent='● Thinking';const pending=addMessage('Thinking…','bot');
try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,history})});let data={};try{data=await response.json()}catch{}if(!response.ok)throw new Error(data.error||'Request failed ('+response.status+').');if(!data.reply)throw new Error('No reply received. Please try again.');pending.lastChild.textContent=data.reply;history.push({role:'user',text:q},{role:'model',text:data.reply});history=history.slice(-12);statusEl.textContent='● Online';}
catch(err){pending.lastChild.textContent='Could not get an AI answer: '+err.message+' Check your deployment and GEMINI_API_KEY setup.';statusEl.textContent='● Setup needed';}
finally{send.disabled=false;send.textContent='Send ↗';input.focus();}}
form.addEventListener('submit',e=>{e.preventDefault();submitPrompt();});document.querySelectorAll('[data-prompt]').forEach(b=>b.addEventListener('click',()=>submitPrompt(b.dataset.prompt)));document.querySelector('#clear').addEventListener('click',()=>{chat.replaceChildren();history=[];welcome.style.display='block';input.value='';statusEl.textContent='● Ready';input.focus();});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});
</script></body></html>
